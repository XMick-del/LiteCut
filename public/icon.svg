<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="capcut-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="capcut-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="capcut-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#f7971e"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#capcut-bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2a2a32" stroke-width="8"/>
  
  <!-- Stylized CapCut Cut Mark / Twin Blade Geometry -->
  <g transform="translate(256,240)">
    <!-- Top left blade -->
    <path d="M -110,-100 C -70,-140 -20,-110 0,-70 C -40,-30 -80,-30 -110,-100 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="-50" cy="-60" r="16" fill="#18181c"/>
    
    <!-- Top right blade -->
    <path d="M 110,-100 C 70,-140 20,-110 0,-70 C 40,-30 80,-30 110,-100 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="50" cy="-60" r="16" fill="#18181c"/>

    <!-- Bottom Cyan Razor Wings -->
    <path d="M -120,60 L 0,-40 L 120,60 L 70,110 L 0,40 L -70,110 Z" fill="url(#capcut-cyan)"/>
    <circle cx="0" cy="-40" r="24" fill="#00f2fe"/>
    <circle cx="0" cy="-40" r="12" fill="#ffffff"/>
  </g>

  <!-- PRO Gold Badge at bottom right -->
  <g transform="translate(330, 390)">
    <rect width="130" height="48" rx="12" fill="url(#capcut-pro)"/>
    <text x="65" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#121214" text-anchor="middle" letter-spacing="2">PRO</text>
  </g>
</svg>
